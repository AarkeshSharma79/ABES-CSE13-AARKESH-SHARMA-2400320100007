<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue</title>
    <link rel="stylesheet" href="styles3.css">
</head>
<body>
    <header>
        <img src="Logo.png" alt="Website Logo">
        <span style="font-size: 1.5em; font-weight: bold;">BookStore</span>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Login</a>
        <a href="#">Registration</a>
        <a href="#">Catalogue</a>
        <a href="#">Cart</a>
    </nav>

    <h2>Book Catalogue</h2>

    <table>
        <tr>
            <th>Category</th>
            <th>Cover Page</th>
            <th>Book Name</th>
            <th>Author</th>
            <th>Publisher</th>
            <th>Price</th>
            <th>Action</th>
        </tr>

        <tr>
            <td>CSE</td>
            <td><img src="xml.jpeg" alt="XML Bible Cover"></td>
            <td>XML Bible</td>
            <td>Winston</td>
            <td>Wiley</td>
            <td>$40.5</td>
            <td><button class="add-btn">Add to Cart</button></td>
        </tr>

        <tr>
            <td>CIVIL</td>
            <td><img src="s russel.jpeg" alt="AI Book Cover"></td>
            <td>AI</td>
            <td>S. Russel</td>
            <td>Princeton Hall</td>
            <td>$63.0</td>
            <td><button class="add-btn">Add to Cart</button></td>
        </tr>
        <tr>
            <td>ECE</td>
            <td colspan="6">No Books Available</td>
        </tr>

        <tr>
            <td>EEE</td>
            <td colspan="6">No Books Available</td>
        </tr>

    </table>

</body>
</html>
