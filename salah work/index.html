<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Gallery with Lightbox</title>
  <link  rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="gallery">
    <img src="https://picsum.photos/id/1011/600/400" alt="Image 1">
    <img src="https://picsum.photos/id/1015/600/400" alt="Image 2">
    <img src="https://picsum.photos/id/1016/600/400" alt="Image 3">
    <img src="https://picsum.photos/id/1020/600/400" alt="Image 4">
    <img src="https://picsum.photos/id/1024/600/400" alt="Image 5">
    <img src="https://picsum.photos/id/1025/600/400" alt="Image 6">
  </div>

  <div class="lightbox" id="lightbox">
    <span class="close" id="closeBtn">&times;</span>
    <span class="prev" id="prevBtn">&#10094;</span>
    <img id="lightboxImage" src="" alt="Enlarged Image">
    <span class="next" id="nextBtn">&#10095;</span>
  </div>

  <script>
    const images = document.querySelectorAll('.gallery img');
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');
    const closeBtn = document.getElementById('closeBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let currentIndex = 0;

    function showLightbox(index) {
      currentIndex = index;
      lightboxImage.src = images[currentIndex].src;
      lightbox.style.display = 'flex';
    }

    function showNext() {
      currentIndex = (currentIndex + 1) % images.length;
      lightboxImage.src = images[currentIndex].src;
    }

    function showPrev() {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      lightboxImage.src = images[currentIndex].src;
    }

    images.forEach((img, index) => {
      img.addEventListener('click', () => showLightbox(index));
    });

    closeBtn.addEventListener('click', () => {
      lightbox.style.display = 'none';
    });

    nextBtn.addEventListener('click', showNext);
    prevBtn.addEventListener('click', showPrev);

    document.addEventListener('keydown', (e) => {
      if (!lightbox.style.display || lightbox.style.display === 'none') return;

      if (e.key === 'ArrowRight') showNext();
      if (e.key === 'ArrowLeft') showPrev();
      if (e.key === 'Escape') lightbox.style.display = 'none';
    });
  </script>
</body>
</html>
